<!DOCTYPE html>
<html lang="gu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline | Indian Billing & Accounting SaaS</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f8fafc;
      color: #0f172a;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 1rem;
      box-sizing: border-box;
    }
    .card {
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 1rem;
      padding: 2.5rem 2rem;
      max-width: 28rem;
      width: 100%;
      text-align: center;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
    }
    .icon {
      width: 4rem;
      height: 4rem;
      background: #ecfdf5;
      color: #059669;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      margin: 0 auto 1.5rem auto;
    }
    h1 {
      font-size: 1.25rem;
      font-weight: 700;
      margin: 0 0 0.5rem 0;
      color: #0f172a;
    }
    h2 {
      font-size: 1.1rem;
      font-weight: 600;
      margin: 0 0 1rem 0;
      color: #16a34a;
    }
    p {
      font-size: 0.875rem;
      line-height: 1.5;
      color: #64748b;
      margin: 0 0 1.5rem 0;
    }
    .btn {
      display: inline-block;
      width: 100%;
      padding: 0.75rem 1rem;
      background-color: #16a34a;
      color: white;
      font-weight: 600;
      font-size: 0.875rem;
      border-radius: 0.5rem;
      border: none;
      cursor: pointer;
      box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      transition: background-color 0.15s ease;
      box-sizing: border-box;
    }
    .btn:hover {
      background-color: #15803d;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">₹</div>
    <h1>You are Offline</h1>
    <h2>તમે હાલમાં ઑફલાઇન છો</h2>
    <p>
      ઇન્ટરનેટ કનેક્શન ઉપલબ્ધ નથી. કૃપા કરીને તમારું નેટવર્ક કનેક્શન તપાસો.<br><br>
      No internet connection detected. Please check your network connection and retry.
    </p>
    <button class="btn" onclick="window.location.reload()">
      પુનઃ પ્રયાસ કરો (Retry Connection)
    </button>
  </div>
</body>
</html>
